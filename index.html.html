<style>
:root{--bg:#f6f7f9;--fg:#1b1f24;--card:#fff;--bd:#d6dae0;--ac:#0b5cad}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--fg:#e8eaed;--card:#1d232a;--bd:#38414b;--ac:#6cb0f5}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0 auto 0 0}label{display:flex;flex-direction:column;font-size:12px;gap:2px}
select,input,button{font:inherit;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
#rg{width:min(320px,70vw);padding:0}
main{display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 66px)}
#map{height:100%;background:#d4e9f7}
body main{position:fixed;inset:0;display:block;height:auto}
body #map{position:absolute;inset:0;z-index:0}
body header{position:fixed;z-index:2000;top:8px;left:8px;right:8px;border:1px solid var(--bd);border-radius:10px;background:color-mix(in srgb,var(--card) 92%,transparent);box-shadow:0 2px 10px #0003}
body aside{position:absolute;z-index:1500;right:8px;bottom:8px;width:340px;max-height:58vh;border:1px solid var(--bd);border-radius:10px;background:color-mix(in srgb,var(--card) 93%,transparent);box-shadow:0 2px 10px #0003}
@media(max-width:800px){body aside{left:8px;width:auto;max-height:42vh}}
aside{padding:12px 14px;overflow:auto;background:var(--card);border-inline-start:1px solid var(--bd)}
aside h2{font-size:16px;margin:0 0 8px}.r{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}
.r b{text-align:end}.tg{font-size:11px;padding:1px 6px;border-radius:9px;margin-inline-start:6px;white-space:nowrap}
.ok{background:#d8f0de;color:#145c27}.gs{background:#ffe6c2;color:#7a4300}
.tm{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.tm.sel{width:34px;height:34px;border:4px solid #111;font-size:16px}
.leg{font-size:12px;margin-top:10px;line-height:1.7}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:4px;vertical-align:-1px}
.note{font-size:12px;opacity:.8;margin-top:10px}.warn{color:#b3261e;font-size:13px;margin-top:6px}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}aside{border:0}}
.hid{display:none!important}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ph h2{margin:0}
.mb{width:100%;margin-top:10px;background:var(--ac);color:#fff;border:0;cursor:pointer}
body #more{right:356px;width:380px;max-height:70vh;z-index:1600}
@media(max-width:800px){body #more{right:8px;left:8px;width:auto;max-height:55vh}}
</style>

  h+=row(x.trav,"≈ "+tv.toFixed(1)+" km",tag("gs"));
  h+=`<button class="mb" onclick="tgl('more')">${x.more}</button>`;
  m+=row(x.pos,"",s.exact?tag("ok",x.rec+" "+hm(s.a.t)):tag("gs",x.ipl+" "+hm(s.a.t)+"→"+hm(s.b.t)));
  m+=row(x.trip,r.trip+" · "+x[r.dir==="o"?"outbound":"inbound"]);
  m+=row(x.next,r.next,s.sw?tag("gs",x.sw):tag("ok",x.csv));
  m+=row(x.sch,hm(r.sch),tag("ok",x.csv));
  m+=row(x.dl,r.dl==null?"—":(r.dlg?"≈ ":"")+r.dl+" min",dg);
  m+=row(x.eta,"≈ "+hm(eta),tag("gs",x.sch.split(" (")[0]+" + "+x.dl.split(" (")[0].toLowerCase()));
  if(eta<t)m+=`<div class="warn">${x.past}</div>`;
  m+=row(x.dist,"≈ "+dist.toFixed(2)+" km",tag("gs"));
  const v=r.sp;
  if(v!=null&&v>=10){const k=t+dist/v*60;m+=row(x.kin,"≈ "+hm(k)+" ("+Math.round(v)+" km/h)",tag("gs"));
   if(Math.abs(k-eta)>3)m+=`<div class="warn">${x.gap} : ${Math.round(Math.abs(k-eta))} min</div>`}
  m+=`<div class="note">${x.dw}</div><div class="note">${x.tw}</div>`;
 }
 m+=`<div class="leg"><i style="background:#2e9e44"></i>${x.l1} &nbsp;<i style="background:#f0a020"></i>${x.l2} &nbsp;<i style="background:#d33"></i>${x.l3} &nbsp;<i style="background:#888"></i>${x.l4}<br>${[1,2,3,4].map(i=>`<i style="background:${PC[i]};border-radius:2px;width:18px;height:4px;vertical-align:3px"></i>${i}`).join(" &nbsp;")}</div><div class="note">${x.pt}</div><div class="note">${x.note}</div>`;
 $("side").innerHTML=h;$("more").innerHTML=m;
}
function lab(){const x=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("ti").textContent=x.ti;$("l-tr").textContent=x.tr;$("l-tm").textContent=x.tm;$("l-rg").textContent=x.rg;$("l-lg").textContent=x.lg;$("ib").textContent="ℹ "+x.inf;render()}
$("lg").onchange=e=>{lang=e.target.value;lab()};
$("tr").onchange=e=>{tr=+e.target.value;render()};
$("rg").oninput=e=>{t=+e.target.value;render()};
$("tm").onchange=e=>{const[h,m]=e.target.value.split(":").map(Number);if(!isNaN(h)){t=Math.min(1335,Math.max(330,h*60+m));render()}};
const tick=()=>{t=t>=1335?330:t+1;render()};
const run=()=>{clearInterval(timer);timer=setInterval(tick,+$("sp").value)};
$("pl").onclick=()=>{if(timer){clearInterval(timer);timer=null;$("pl").textContent="▶"}else{$("pl").textContent="⏸";run()}};
$("sp").onchange=()=>{if(timer)run()};
const vis={side:false,more:false};
function show(){$("side").classList.toggle("hid",!vis.side);$("more").classList.toggle("hid",!vis.more)}
function tgl(k){vis[k]=!vis[k];if(k==="side"&&!vis.side)vis.more=false;if(k==="more"&&vis.more)vis.side=true;show()}
lab();
</script>
</body>
